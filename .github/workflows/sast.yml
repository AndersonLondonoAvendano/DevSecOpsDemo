name: 40 - SAST pipeline

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.171.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        continue-on-error: true
        run: semgrep scan --config p/ci --sarif -o semgrep-results.sarif

      - name: Upload Semgrep report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sast-report
          path: semgrep-results.sarif
          retention-days: 7

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          upload-database: false
          output: codeql-results

      - name: Upload CodeQL report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sast-report
          path: codeql-results
          retention-days: 7

  spotbugs:
    name: Static analysis (SpotBugs + Find Security Bugs)
    runs-on: ubuntu-latest
    env:
      SPOTBUGS_VERSION: "4.10.3"
      FINDSECBUGS_VERSION: "1.14.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile project and build classpath
        run: mvn --batch-mode --no-transfer-progress compile dependency:build-classpath -Dmdep.outputFile=classpath.txt

      - name: Download SpotBugs CLI and Find Security Bugs plugin
        run: |
          curl -sSL -o spotbugs.tgz "https://github.com/spotbugs/spotbugs/releases/download/${SPOTBUGS_VERSION}/spotbugs-${SPOTBUGS_VERSION}.tgz"
          tar -xzf spotbugs.tgz
          curl -sSL -o findsecbugs-plugin.jar "https://repo1.maven.org/maven2/com/h3xstream/findsecbugs/findsecbugs-plugin/${FINDSECBUGS_VERSION}/findsecbugs-plugin-${FINDSECBUGS_VERSION}.jar"

      - name: Run SpotBugs + Find Security Bugs
        continue-on-error: true
        run: |
          ./spotbugs-${SPOTBUGS_VERSION}/bin/spotbugs -textui \
            -pluginList findsecbugs-plugin.jar \
            -effort:max \
            -auxclasspath "$(cat classpath.txt)" \
            -sarif=spotbugs-results.sarif \
            target/classes

      - name: Upload SpotBugs report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-sast-report
          path: spotbugs-results.sarif
          retention-days: 7
