name: 00 - Main CI / CD Pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit

  sca:
    needs: build
    name: SCA
    uses: ./.github/workflows/sca.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit
