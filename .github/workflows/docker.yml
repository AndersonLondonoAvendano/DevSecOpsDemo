name: 50 - Docker Build & Push pipeline

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image-name:
        description: Fully qualified image name (without tag) that was built and pushed
        value: ${{ jobs.build-and-push.outputs.image-name }}
      image-tag:
        description: Build tag of the image that was built and pushed
        value: ${{ jobs.build-and-push.outputs.image-tag }}

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image-name: ${{ steps.image-meta.outputs.name }}
      image-tag: ${{ steps.image-meta.outputs.build-tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: image-meta
        run: |
          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"

          BUILD_TAG="build-${{ github.run_number }}"
          SHA_TAG="${{ github.sha }}"

          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "build-tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "sha-tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          provenance: false

          tags: |
            ${{ steps.image-meta.outputs.name }}:${{ steps.image-meta.outputs.build-tag }}
            ${{ steps.image-meta.outputs.name }}:${{ steps.image-meta.outputs.sha-tag }}
            ${{ steps.image-meta.outputs.name }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max