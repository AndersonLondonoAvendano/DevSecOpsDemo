name: 60 - Container Image Scan pipeline

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image-name:
        description: Fully qualified image name (without tag) to scan
        required: true
        type: string
      image-tag:
        description: Tag of the image to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image-name }}:${{ inputs.image-tag }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-image-results.sarif
          exit-code: "0"

      - name: Upload results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-results.sarif
          category: container-image

      - name: Upload results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-results
          path: trivy-image-results.sarif
          retention-days: 7
